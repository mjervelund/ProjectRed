plugins {
    id 'net.neoforged.moddev'
}

String mod_id = 'projectred_integration'

neoForge {
    version = forge_version

    accessTransformers.from "../core/src/main/resources/META-INF/accesstransformer.cfg"

    // Minecraft/NeoForge classes for the plain JUnit tests
    addModdingDependenciesTo(sourceSets.test)

    // FML 12 only loads the main source set in dev runs when it is declared as a mod
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        data {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file("src/main/generated").absolutePath, '--existing', file("src/main/resources").absolutePath
        }
    }
}

dependencies {
    implementation "io.codechicken:CodeChickenLib:${mc_version}-${ccl_version}"
    implementation "io.codechicken:CBMultipart:${mc_version}-${cbm_version}"

    accessTransformers "io.codechicken:CodeChickenLib:${mc_version}-${ccl_version}"
    accessTransformers "io.codechicken:CBMultipart:${mc_version}-${cbm_version}"

    compileOnly project(":api")
    implementation(project(":core")) { exclude group: "mrtjp", module: "api" } // api comes jar-in-jar through core

    // Plain JUnit (no FML unit-test bootstrap): the tests only touch NBT and part fields
    testImplementation project(":api")
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}
